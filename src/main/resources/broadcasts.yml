#  📋 ДОКУМЕНТАЦИЯ:
#
#  📋 ПЛЕЙСХОЛДЕРЫ:
#    %player%  - Ник игрока
#    %online%  - Текущий онлайн сервера
#    %NL%      - Новая строка
#
#  ⚙️ НАСТРОЙКИ:
#    enabled: true/false    - Включить/выключить объявления
#    interval: 60           - Интервал между объявлениями (секунды)
#
#  📢 СТРУКТУРА ОБЪЯВЛЕНИЯ:
#
#    broadcast_id:                      # Уникальный ID объявления
#      messages:                        # Список сообщений
#        - "&7Текст первой строки"
#        - "&eТекст второй строки"
#
#      button:                          # [ОПЦИОНАЛЬНО] Кликабельная кнопка
#        text: "&a[НАЖМИ]"              # Текст кнопки
#        command: "команда"             # Команда БЕЗ "/" (выполнится от игрока)
#                                       # Либо ссылка (http:// / https://) - откроется в браузере
#        hover:                         # [ОПЦИОНАЛЬНО] Подсказка при наведении
#          - "&aПервая строка hover"
#          - "&7Вторая строка hover"
#
#      hover:                           # [ОПЦИОНАЛЬНО] Hover на текст сообщения
#        mode: "all"                    # "all" - на все строки, "line" - на конкретные
#        text:                          # Текст подсказки
#          - "&eПервая строка"
#          - "&7Вторая строка"
#        lines: [0, 1]                  # [Только для mode: "line"] Номера строк (начиная с 0)
#
#      sound:                           # [ОПЦИОНАЛЬНО] Звук при показе объявления
#        name: "ENTITY_EXPERIENCE_ORB_PICKUP"  # Название звука
#        volume: 1.0                    # Громкость (0.0 - 2.0)
#        pitch: 1.0                     # Высота тона (0.5 - 2.0)
#
#  🎵 ПОПУЛЯРНЫЕ ЗВУКИ:
#    ENTITY_EXPERIENCE_ORB_PICKUP  - Звук получения опыта
#    ENTITY_PLAYER_LEVELUP         - Звук повышения уровня
#    BLOCK_NOTE_BLOCK_PLING        - Звук колокольчика
#    UI_BUTTON_CLICK               - Звук клика по кнопке
#    ENTITY_ARROW_HIT_PLAYER       - Звук попадания стрелы
#    BLOCK_ANVIL_LAND              - Звук падения наковальни
#
#    Полный список: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
#
#  ⚡ ОСОБЕННОСТИ:
#    • Объявления отправляются в случайном порядке
#    • Каждое объявление показывается один раз, затем список обновляется
#    • Ссылки в тексте сообщений автоматически кликабельны
#      (example.ru или https://example.ru - откроются по клику)
#    • Поддержка HEX цветов: &#FF5555
#    • Поддержка стандартных цветов: &a, &c, &e и т.д.

settings:
  enabled: true
  interval: 30

broadcasts:
  donate:
    messages:
      - "&#EAD165🔔 &fПоддержи наш проект"
      - "     &fПокупка &#EAD165доната тут"
      - "     &#EAD165example.ru"
    hover:
      mode: "line"
      lines: [1, 2]
      text:
        - "&fуебок жирный купи &#EAD165донат)"
    sound:
      name: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 1.0
      pitch: 1.5